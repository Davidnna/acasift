services:
  - type: web
    name: acasift
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: NGRAM_SIZE
        value: "5"
      - key: MAX_COMPARISON_SOURCES
        value: "50"
      - key: MAX_CONTENT_LENGTH_MB
        value: "15"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: PUBLIC_APP_URL
        value: "https://acasift.onrender.com"
      - key: EMAIL_VERIFICATION_HOURS
        value: "24"
      - key: PASSWORD_RESET_HOURS
        value: "1"
