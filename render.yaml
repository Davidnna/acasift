services:
  - type: web
    name: acasift
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: NGRAM_SIZE
        value: "5"
      - key: MAX_COMPARISON_SOURCES
        value: "50"
      - key: MAX_CONTENT_LENGTH_MB
        value: "15"
      - key: SESSION_COOKIE_SECURE
        value: "true"
