services:
  - type: web
    name: acasift
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: NGRAM_SIZE
        value: "5"
      - key: MAX_CONTENT_LENGTH_MB
        value: "15"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: NYLAS_API_KEY
        sync: false
      - key: NYLAS_API_URI
        value: "https://api.us.nylas.com"
      - key: NYLAS_SENDING_DOMAIN
        value: "acasift.nylas.email"
      - key: NYLAS_FROM_NAME
        value: "AcaSift"
      - key: NYLAS_FROM_EMAIL_VERIFICATION
        value: "verify@acasift.nylas.email"
      - key: NYLAS_FROM_EMAIL_PASSWORD_RESET
        value: "security@acasift.nylas.email"
      - key: NYLAS_FROM_EMAIL_NOTIFICATION
        value: "notifications@acasift.nylas.email"
      - key: NYLAS_API_TIMEOUT
        value: "20"
      - key: PUBLIC_APP_URL
        value: "https://acasift.onrender.com"
      - key: EMAIL_VERIFICATION_HOURS
        value: "24"
      - key: PASSWORD_RESET_HOURS
        value: "1"

      - key: SCHOLARLY_SEARCH_CONTACT_EMAIL
        sync: false
      - key: MAX_EXTERNAL_SOURCES
        value: "40"
      - key: MAX_EXTERNAL_DOWNLOADS
        value: "8"
      - key: MAX_EXTERNAL_DOWNLOAD_MB
        value: "12"
      - key: MAX_EXTERNAL_QUERIES
        value: "3"
      - key: EXTERNAL_HTTP_TIMEOUT_SECONDS
        value: "8"
      - key: EXTERNAL_DISCOVERY_MAX_WORKERS
        value: "12"
      - key: EXTERNAL_RETRIEVAL_MAX_WORKERS
        value: "4"
      - key: EXTERNAL_DISCOVERY_CACHE_TTL_SECONDS
        value: "300"
      - key: MAX_UNPAYWALL_LOOKUPS_PER_RUN
        value: "20"
      - key: ENABLE_LOCAL_SEMANTIC
        value: "false"
      - key: SEMANTIC_MODEL_NAME
        value: "sentence-transformers/all-MiniLM-L6-v2"
      - key: SEMANTIC_MATCH_THRESHOLD
        value: "0.82"
